name: Secret Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    # Weekly full-history scan: PR/push scans only cover the new commit range,
    # so a secret already in history is never flagged by them.
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC

concurrency:
  # The scheduled scan gets its own group so it never replaces (or is replaced
  # by) a pending push scan of the same branch.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; protected-branch pushes are not, so
  # every pushed commit range is still scanned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          # Live base BRANCH, not the creation-time-frozen base.sha — a stale
          # base charges every commit the base gained since to this PR's scan.
          # Env indirection: never interpolate github.* into a run: block.
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          gitleaks git . --redact --config .gitleaks.toml --verbose \
            --log-opts="origin/${PR_BASE_REF}..HEAD"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="-1"
          else
            LOG_OPTS="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          gitleaks git . --redact --config .gitleaks.toml --verbose --log-opts="$LOG_OPTS"

      - name: Scan current commit
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git . --redact --config .gitleaks.toml --verbose --log-opts="-1"

      - name: Scan full history
        if: github.event_name == 'schedule'
        run: gitleaks git . --redact --config .gitleaks.toml --verbose
