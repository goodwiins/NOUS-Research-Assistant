# EKS dev child app (Task 5). Modeled on dev.yaml (the DOKS child) with:
#   - values-aws.yaml instead of values-dev.yaml (ECR images, RDS/ElastiCache
#     via Infisical, ALB ingress, gp3).
#   - targetRevision follows develop for automatic release promotion.
#   - destination namespace multimodal-rag-system (the app manifests' ns).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nous-dev-aws
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nous-platform
    environment: aws-dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nous-platform

  source:
    repoURL: https://github.com/goodwiins/NOUS-Research-Assistant.git
    targetRevision: develop
    path: infrastructure/helm/knowledge-graph-analytics
    helm:
      valueFiles:
        - values.yaml
        - values-aws.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: multimodal-rag-system

  # Auto-sync once enabled (runbook Step 6d flips it on after scale-up)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    # Full release syncs include the wave-1 Job even when a prior attempt
    # already applied its manifest. Its completion gates the consumers.
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      # EKS does not have KEDA or cert-manager CRDs yet (Task 3 addon gap):
      # without this, their absence invalidates the WHOLE sync (ArgoCD
      # dry-run fails on undiscoverable GVKs and applies nothing). Skipped
      # items self-apply on the next sync once the CRDs are installed.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Health checks / drift tolerances
  ignoreDifferences:
    # The namespace-local Reloader owns only its rollout marker.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
    - group: apps
      kind: Deployment
      # Only the worker HPA owns replicas. Backend and beat must follow Git.
      name: nous-dev-aws-celery-worker
      jsonPointers:
        - /spec/replicas
    # The Infisical operator owns the synced Secret lifecycle and mutates
    # InfisicalSecret status — not drift the app should fight (see
    # templates/infisical-secrets.yaml).
    - group: secrets.infisical.com
      kind: InfisicalSecret
      jsonPointers:
        - /status
