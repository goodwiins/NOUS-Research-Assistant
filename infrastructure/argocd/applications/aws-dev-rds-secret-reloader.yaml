apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-dev-rds-secret-reloader
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nous-platform
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.20
    helm:
      releaseName: rds-secret-reloader
      values: |
        reloader:
          watchGlobally: false
          ignoreConfigMaps: true
          ignoreJobs: true
          ignoreCronJobs: true
          reloadStrategy: annotations
          resourceLabelSelector: nous.goodwiinz.tech/reload-rds-credentials=true
  destination:
    server: https://kubernetes.default.svc
    namespace: multimodal-rag-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
